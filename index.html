
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Free online text to voice converter. Convert text into speech instantly without login or signup.">

    <meta name="theme-color" content="#090b18">
<meta name="google-site-verification" content="mdP1CM0Iwzu4npVZh69IIXdfzqIA7EZ3WD19Dgi4jec" />
    <title>Text to Voice - Free Online Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon">♫</span>
            <span>Text to <span class="purple">Voice</span></span>
        </div>

        <div class="free-badge">
            ⚡ Free · No Login
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-container">

        <!-- ADVERTISEMENT SPACE -->
        <aside class="ad-container">
            <span class="ad-label">Advertisement</span>

            <div class="ad-content">
                <span class="ad-icon">AD</span>
                <p>Your Advertisement Here</p>
            </div>
        </aside>

        <!-- CONVERTER -->
        <section class="converter">

            <div class="section-heading">
                <h1>Text to Voice Converter</h1>
                <p>Turn your text into speech instantly.</p>
            </div>

            <!-- LANGUAGE -->
            <div class="field-heading">
                <label for="languageSelect">Select Language</label>
            </div>

            <select id="languageSelect" class="select-box">
                <option value="all">All Available Voices</option>
            </select>

            <!-- TEXT INPUT -->
            <div class="field-heading">
                <label for="textInput">Enter Your Text</label>

                <button id="clearBtn" class="clear-btn">
                    Clear
                </button>
            </div>

            <textarea
                id="textInput"
                maxlength="5000"
                placeholder="Type or paste your text here..."
            ></textarea>

            <div class="character-info">
                <span id="charCount">0 / 5000 characters</span>
            </div>

            <!-- VOICE SELECTION -->
            <div class="controls-grid">

                <div class="control-group">
                    <label for="voiceSelect">Select Voice</label>

                    <select id="voiceSelect" class="select-box">
                        <option value="">Loading voices...</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="speedControl">
                        Speed: <span id="speedValue">1.0x</span>
                    </label>

                    <input
                        type="range"
                        id="speedControl"
                        min="0.5"
                        max="2"
                        step="0.1"
                        value="1"
                    >
                </div>

                <div class="control-group">
                    <label for="pitchControl">
                        Pitch: <span id="pitchValue">1.0</span>
                    </label>

                    <input
                        type="range"
                        id="pitchControl"
                        min="0"
                        max="2"
                        step="0.1"
                        value="1"
                    >
                </div>

            </div>

            <!-- ACTION BUTTONS -->
            <div class="action-buttons">

                <button id="speakBtn" class="primary-btn">
                    ▶ Generate Voice
                </button>

                <button id="pauseBtn" class="secondary-btn">
                    ⏸ Pause
                </button>

                <button id="stopBtn" class="secondary-btn">
                    ■ Stop
                </button>

            </div>

            <p id="statusMessage" class="status-message">
                Ready to convert your text into speech.
            </p>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>Free Text to Voice Converter · No Login Required</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
